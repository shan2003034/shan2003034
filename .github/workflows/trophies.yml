name: Update GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download & Save Trophies SVG
        run: |
          mkdir -p profile-3d-contrib
          USER="${{ github.repository_owner }}"
          PARAMS="username=${USER}&theme=tokyonight&no-frame=true&no-bg=true&margin-w=15&column=6"
          
          # Working servers kihipayakin try karala SVG eka gannawa
          curl -f -s "https://github-profile-trophy.vercel.app/?${PARAMS}" -o profile-3d-contrib/trophies.svg || \
          curl -f -s "https://github-profile-trophy-fork-alpha.vercel.app/?${PARAMS}" -o profile-3d-contrib/trophies.svg || \
          curl -f -s "https://trophy.ryo-ma.com/?${PARAMS}" -o profile-3d-contrib/trophies.svg

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "Update GitHub trophies" || exit 0
          git push
