name: Discord GitHub Account Monitor

on:
  schedule:
    # Checks the entire GitHub account (Public + Private) every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-account:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Public & Private Repos and Send Cyberpunk Embeds
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          WEBHOOK_REPOS: ${{ secrets.DISCORD_WEBHOOK_REPOS }}
          WEBHOOK_ACTIVITY: ${{ secrets.DISCORD_WEBHOOK_ACTIVITY }}
          WEBHOOK_STARS: ${{ secrets.DISCORD_WEBHOOK_STARS }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          username = os.environ['USERNAME']
          gh_pat = os.environ['GH_PAT']
          w_repos = os.environ['WEBHOOK_REPOS']
          w_activity = os.environ['WEBHOOK_ACTIVITY']
          w_stars = os.environ['WEBHOOK_STARS']
          state_file = '.github/state/discord_repo_state.json'

          os.makedirs('.github/state', exist_ok=True)

          def github_get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': f'Bearer {gh_pat}',
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'GitHub-Cyberpunk-Monitor'
                  }
              )
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode())

          def send_discord(webhook_url, bot_name, title, description, color, repo_name, actor_name, actor_avatar, fields=None):
              if not webhook_url:
                  return
              embed = {
                  "title": title,
                  "url": f"https://github.com/{repo_name}",
                  "description": description,
                  "color": color,
                  "author": {
                      "name": f"@{actor_name}",
                      "url": f"https://github.com/{actor_name}",
                      "icon_url": actor_avatar
                  },
                  "thumbnail": {
                      "url": actor_avatar
                  },
                  "footer": {
                      "text": f"SYSTEM // {repo_name}"
                  },
                  "timestamp": datetime.now(timezone.utc).isoformat()
              }
              if fields:
                  embed["fields"] = fields

              payload = {
                  "username": bot_name,
                  "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                  "embeds": [embed]
              }
              req = urllib.request.Request(
                  webhook_url,
                  data=json.dumps(payload).encode('utf-8'),
                  headers={'Content-Type': 'application/json', 'User-Agent': 'GitHub-Cyberpunk-Monitor'}
              )
              urllib.request.urlopen(req)

          # Fetch ALL repositories (Public + Private) sorted by most recently pushed
          repos = github_get("https://api.github.com/user/repos?affiliation=owner&sort=pushed&per_page=100")
          user_info = github_get(f"https://api.github.com/users/{username}")
          avatar = user_info.get('avatar_url', '')

          current_state = {}
          for r in repos:
              full_name = r['full_name']
              current_state[full_name] = {
                  "pushed_at": r.get('pushed_at', ''),
                  "private": r.get('private', False),
                  "stars": r.get('stargazers_count', 0),
                  "forks": r.get('forks_count', 0),
                  "default_branch": r.get('default_branch', 'main')
              }

          # First-time setup
          if not os.path.exists(state_file):
              with open(state_file, 'w') as f:
                  json.dump(current_state, f, indent=2)
              send_discord(
                  w_repos,
                  "Repo Watcher",
                  "⚡ CYBERPUNK MONITOR v2 ONLINE",
                  "Full-spectrum scanning enabled! Both **Public** and **Private** repositories are now monitored.",
                  0x00f3ff, # Neon Cyan
                  f"{username}/{username}",
                  username,
                  avatar,
                  fields=[
                      {"name": "📡 Scope", "value": "`PUBLIC + PRIVATE`", "inline": True},
                      {"name": "📦 Tracked Repos", "value": f"`{len(current_state)}`", "inline": True}
                  ]
              )
              exit(0)

          with open(state_file, 'r') as f:
              old_state = json.load(f)

          for repo_name, info in current_state.items():
              # Skip state updates on the monitor repo itself caused by this workflow
              if repo_name == f"{username}/{username}":
                  continue

              visibility = "PRIVATE 🔒" if info['private'] else "PUBLIC 🌐"

              # 1. NEW REPOSITORY CREATED
              if repo_name not in old_state:
                  send_discord(
                      w_repos,
                      "Repo Watcher",
                      "🆕 NEW REPOSITORY DEPLOYED",
                      f"**{username}** created a new repository.",
                      0x00ff9f, # Neon Mint Green
                      repo_name, username, avatar,
                      fields=[
                          {"name": "📦 Repository", "value": f"`{repo_name}`", "inline": True},
                          {"name": "🔐 Visibility", "value": f"`{visibility}`", "inline": True}
                      ]
                  )
              else:
                  old_info = old_state[repo_name]

                  # VISIBILITY CHANGED (Private -> Public)
                  if old_info.get('private') and not info['private']:
                      send_discord(
                          w_repos,
                          "Repo Watcher",
                          "🌐 REPOSITORY WENT PUBLIC",
                          f"`{repo_name}` is now visible to the public network.",
                          0xa371f7, # Cyberpunk Purple
                          repo_name, username, avatar,
                          fields=[
                              {"name": "📦 Repository", "value": f"`{repo_name}`", "inline": True},
                              {"name": "🔓 Status", "value": "`PUBLIC`", "inline": True}
                          ]
                      )

                  # 2. CODE PUSHED / COMMITTED
                  if info['pushed_at'] != old_info.get('pushed_at'):
                      # Get latest commit message
                      try:
                          commits = github_get(f"https://api.github.com/repos/{repo_name}/commits?per_page=1")
                          commit_msg = commits[0]['commit']['message'].splitlines()[0] if commits else "New code pushed"
                          author_name = commits[0]['commit']['author']['name'] if commits else username
                      except Exception:
                          commit_msg = "New update pushed"
                          author_name = username

                      send_discord(
                          w_activity,
                          "Code Pulse",
                          "🚀 CODE PUSH DETECTED",
                          f"**Commit:** `{commit_msg}`",
                          0x00f3ff, # Neon Cyan
                          repo_name, username, avatar,
                          fields=[
                              {"name": "🌿 Branch", "value": f"`{info['default_branch']}`", "inline": True},
                              {"name": "🔐 Visibility", "value": f"`{visibility}`", "inline": True},
                              {"name": "👤 Author", "value": f"`{author_name}`", "inline": True}
                          ]
                      )

                  # 3. STARS & FORKS
                  if info['stars'] > old_info.get('stars', 0):
                      diff = info['stars'] - old_info.get('stars', 0)
                      send_discord(
                          w_stars,
                          "Star Tracker",
                          "⭐ NEW STAR RECEIVED",
                          f"`{repo_name}` gained **{diff}** new star(s)!",
                          0xffd700, # Cyber Gold
                          repo_name, username, avatar,
                          fields=[
                              {"name": "⭐ Total Stars", "value": f"`{info['stars']}`", "inline": True},
                              {"name": "📦 Repository", "value": f"`{repo_name}`", "inline": True}
                          ]
                      )

                  if info['forks'] > old_info.get('forks', 0):
                      diff = info['forks'] - old_info.get('forks', 0)
                      send_discord(
                          w_stars,
                          "Star Tracker",
                          "🍴 REPOSITORY FORKED",
                          f"`{repo_name}` was forked (**+{diff}**)! ",
                          0xff9900, # Neon Amber
                          repo_name, username, avatar,
                          fields=[
                              {"name": "🍴 Total Forks", "value": f"`{info['forks']}`", "inline": True},
                              {"name": "📦 Repository", "value": f"`{repo_name}`", "inline": True}
                          ]
                      )

          # Save updated state
          with open(state_file, 'w') as f:
              json.dump(current_state, f, indent=2)
          EOF

      - name: Save Monitor State
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/state/discord_repo_state.json
          git commit -m "Update discord repo monitor state" || exit 0
          git push
