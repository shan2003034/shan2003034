name: Discord GitHub Account Monitor

on:
  schedule:
    # Hama winadi 15 kata sarayak mulu account ekama check karanawa
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-account:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Account Events & Send Discord Embeds
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          WEBHOOK_REPOS: ${{ secrets.DISCORD_WEBHOOK_REPOS }}
          WEBHOOK_ACTIVITY: ${{ secrets.DISCORD_WEBHOOK_ACTIVITY }}
          WEBHOOK_STARS: ${{ secrets.DISCORD_WEBHOOK_STARS }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          username = os.environ['USERNAME']
          gh_pat = os.environ['GH_PAT']
          w_repos = os.environ['WEBHOOK_REPOS']
          w_activity = os.environ['WEBHOOK_ACTIVITY']
          w_stars = os.environ['WEBHOOK_STARS']
          state_file = '.github/state/discord_last_event.txt'

          os.makedirs('.github/state', exist_ok=True)

          def send_discord(webhook_url, title, description, color, repo_name, actor_name, actor_avatar):
              if not webhook_url:
                  return
              payload = {
                  "username": "GitHub Command Center",
                  "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                  "embeds": [
                      {
                          "title": title,
                          "url": f"https://github.com/{repo_name}",
                          "description": description,
                          "color": color,
                          "author": {
                              "name": actor_name,
                              "url": f"https://github.com/{actor_name}",
                              "icon_url": actor_avatar
                          },
                          "footer": {
                              "text": f"Repository: {repo_name}"
                          }
                      }
                  ]
              }
              req = urllib.request.Request(
                  webhook_url,
                  data=json.dumps(payload).encode('utf-8'),
                  headers={'Content-Type': 'application/json', 'User-Agent': 'GitHub-Actions-Monitor'}
              )
              urllib.request.urlopen(req)

          req = urllib.request.Request(
              f"https://api.github.com/users/{username}/events?per_page=20",
              headers={'Authorization': f'Bearer {gh_pat}', 'Accept': 'application/vnd.github+json'}
          )
          with urllib.request.urlopen(req) as resp:
              events = json.loads(resp.read().decode())

          if not events:
              exit(0)

          last_id = None
          if os.path.exists(state_file):
              with open(state_file, 'r') as f:
                  last_id = f.read().strip()

          # Palaweni parata run weddi danata thiyena anthima event ID eka save karagannawa
          if not last_id:
              with open(state_file, 'w') as f:
                  f.write(str(events[0]['id']))
              send_discord(
                  w_repos,
                  "✅ Discord GitHub Monitor Activated!",
                  "Oyaage mulu GitHub account ekema siduwana wenasakam dan channels 3ta wenama labevi!",
                  5793266, # Cyberpunk Blue
                  f"{username}/{username}",
                  username,
                  events[0]['actor']['avatar_url']
              )
              exit(0)

          new_events = []
          for ev in events:
              if str(ev['id']) == last_id:
                  break
              new_events.append(ev)

          for ev in reversed(new_events):
              ev_type = ev['type']
              repo = ev['repo']['name']
              actor = ev['actor']['login']
              avatar = ev['actor']['avatar_url']
              payload = ev.get('payload', {})

              # 1. NEW REPOS CHANNEL (Neon Green: 3066993 / Cyberpunk Purple: 10711543)
              if ev_type == 'CreateEvent' and payload.get('ref_type') == 'repository':
                  send_discord(w_repos, "🆕 New Repository Created!", f"**{actor}** විසින් `{repo}` නමින් අලුත් repository එකක් සාදන ලදී.", 3066993, repo, actor, avatar)
              elif ev_type == 'PublicEvent':
                  send_discord(w_repos, "🌍 Repository Made Public!", f"`{repo}` repository එක Public කරන ලදී.", 10711543, repo, actor, avatar)

              # 2. CODE ACTIVITY CHANNEL (Cyberpunk Blue: 5793266 / Red: 15158332)
              elif ev_type == 'PushEvent':
                  branch = payload.get('ref', '').replace('refs/heads/', '')
                  commits_count = len(payload.get('commits', []))
                  send_discord(w_activity, "🚀 New Code Pushed!", f"**Branch:** `{branch}`\n**Commits:** {commits_count} new commit(s) pushed.", 5793266, repo, actor, avatar)
              elif ev_type == 'CreateEvent' and payload.get('ref_type') == 'branch':
                  send_discord(w_activity, "🌿 New Branch Created!", f"**Branch:** `{payload.get('ref')}` සාදන ලදී.", 5793266, repo, actor, avatar)
              elif ev_type == 'DeleteEvent':
                  send_discord(w_activity, "🗑️ Branch / Tag Deleted!", f"**Deleted ({payload.get('ref_type')}):** `{payload.get('ref')}` ඉවත් කරන ලදී.", 15158332, repo, actor, avatar)

              # 3. STARS & FORKS CHANNEL (Gold: 15844367)
              elif ev_type == 'WatchEvent':
                  send_discord(w_stars, "⭐ New Star Received!", f"**{actor}** විසින් ඔබේ `{repo}` repository එකට Star එකක් ලබා දුන්නා!", 15844367, repo, actor, avatar)
              elif ev_type == 'ForkEvent':
                  send_discord(w_stars, "🍴 Repository Forked!", f"**{actor}** විසින් `{repo}` repository එක Fork කරන ලදී!", 15844367, repo, actor, avatar)

          if new_events:
              with open(state_file, 'w') as f:
                  f.write(str(new_events[0]['id']))
          EOF

      - name: Save Monitor State
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/state/discord_last_event.txt
          git commit -m "Update discord monitor state" || exit 0
          git push
