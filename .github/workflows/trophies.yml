name: Update GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate Trophies SVG
        uses: jwenjian/github-profile-trophy-action@v1
        with:
          username: ${{ github.repository_owner }}
          theme: tokyonight
          no-frame: true
          no-bg: true
          margin-w: 15
          column: 6
          output: ./profile-3d-contrib/trophies.svg

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "Update GitHub trophies" || exit 0
          git push
