name: Discord GitHub Account Monitor

on:
  schedule:
    # Checks the entire GitHub account every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-account:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Account Events & Send Cyberpunk Discord Embeds
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          WEBHOOK_REPOS: ${{ secrets.DISCORD_WEBHOOK_REPOS }}
          WEBHOOK_ACTIVITY: ${{ secrets.DISCORD_WEBHOOK_ACTIVITY }}
          WEBHOOK_STARS: ${{ secrets.DISCORD_WEBHOOK_STARS }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request
          from datetime import datetime, timezone

          username = os.environ['USERNAME']
          gh_pat = os.environ['GH_PAT']
          w_repos = os.environ['WEBHOOK_REPOS']
          w_activity = os.environ['WEBHOOK_ACTIVITY']
          w_stars = os.environ['WEBHOOK_STARS']
          state_file = '.github/state/discord_last_event.txt'

          os.makedirs('.github/state', exist_ok=True)

          def send_discord(webhook_url, bot_name, title, description, color, repo_name, actor_name, actor_avatar, fields=None):
              if not webhook_url:
                  return
              embed = {
                  "title": title,
                  "url": f"https://github.com/{repo_name}",
                  "description": description,
                  "color": color,
                  "author": {
                      "name": f"@{actor_name}",
                      "url": f"https://github.com/{actor_name}",
                      "icon_url": actor_avatar
                  },
                  "thumbnail": {
                      "url": actor_avatar
                  },
                  "footer": {
                      "text": f"SYSTEM // {repo_name}"
                  },
                  "timestamp": datetime.now(timezone.utc).isoformat()
              }
              if fields:
                  embed["fields"] = fields

              payload = {
                  "username": bot_name,
                  "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                  "embeds": [embed]
              }
              req = urllib.request.Request(
                  webhook_url,
                  data=json.dumps(payload).encode('utf-8'),
                  headers={'Content-Type': 'application/json', 'User-Agent': 'GitHub-Cyberpunk-Monitor'}
              )
              urllib.request.urlopen(req)

          req = urllib.request.Request(
              f"https://api.github.com/users/{username}/events?per_page=20",
              headers={'Authorization': f'Bearer {gh_pat}', 'Accept': 'application/vnd.github+json'}
          )
          with urllib.request.urlopen(req) as resp:
              events = json.loads(resp.read().decode())

          if not events:
              exit(0)

          last_id = None
          if os.path.exists(state_file):
              with open(state_file, 'r') as f:
                  last_id = f.read().strip()

          # Initial activation alert
          if not last_id:
              with open(state_file, 'w') as f:
                  f.write(str(events[0]['id']))
              send_discord(
                  w_repos,
                  "Repo Watcher",
                  "⚡ CYBERPUNK MONITOR ONLINE",
                  "GitHub Command Center is now active. All account events will stream directly to your channels.",
                  0x00f3ff, # Neon Cyan
                  f"{username}/{username}",
                  username,
                  events[0]['actor']['avatar_url'],
                  fields=[
                      {"name": "📡 Status", "value": "`ACTIVE`", "inline": True},
                      {"name": "👤 Target", "value": f"`{username}`", "inline": True}
                  ]
              )
              exit(0)

          new_events = []
          for ev in events:
              if str(ev['id']) == last_id:
                  break
              new_events.append(ev)

          for ev in reversed(new_events):
              ev_type = ev['type']
              repo = ev['repo']['name']
              actor = ev['actor']['login']
              avatar = ev['actor']['avatar_url']
              payload = ev.get('payload', {})

              # 1. REPO WATCHER (#new-repos)
              if ev_type == 'CreateEvent' and payload.get('ref_type') == 'repository':
                  send_discord(
                      w_repos,
                      "Repo Watcher",
                      "🆕 NEW REPOSITORY DEPLOYED",
                      f"**{actor}** initialized a brand new repository.",
                      0x00ff9f, # Neon Mint Green
                      repo, actor, avatar,
                      fields=[
                          {"name": "📦 Repository", "value": f"`{repo}`", "inline": True},
                          {"name": "⚡ Action", "value": "`CREATED`", "inline": True}
                      ]
                  )
              elif ev_type == 'PublicEvent':
                  send_discord(
                      w_repos,
                      "Repo Watcher",
                      "🌐 REPOSITORY WENT PUBLIC",
                      f"`{repo}` is now visible to the public network.",
                      0xa371f7, # Cyberpunk Purple
                      repo, actor, avatar,
                      fields=[
                          {"name": "📦 Repository", "value": f"`{repo}`", "inline": True},
                          {"name": "🔓 Visibility", "value": "`PUBLIC`", "inline": True}
                      ]
                  )

              # 2. CODE PULSE (#code-activity)
              elif ev_type == 'PushEvent':
                  branch = payload.get('ref', '').replace('refs/heads/', '')
                  commits_count = len(payload.get('commits', []))
                  send_discord(
                      w_activity,
                      "Code Pulse",
                      "🚀 CODE PUSH DETECTED",
                      f"Fresh commits pushed to `{repo}`.",
                      0x00f3ff, # Neon Cyan
                      repo, actor, avatar,
                      fields=[
                          {"name": "🌿 Branch", "value": f"`{branch}`", "inline": True},
                          {"name": "📝 Commits", "value": f"`{commits_count} commit(s)`", "inline": True}
                      ]
                  )
              elif ev_type == 'CreateEvent' and payload.get('ref_type') == 'branch':
                  branch_name = payload.get('ref')
                  send_discord(
                      w_activity,
                      "Code Pulse",
                      "🌿 NEW BRANCH CREATED",
                      f"A new development branch was spun up in `{repo}`.",
                      0xa371f7, # Cyberpunk Purple
                      repo, actor, avatar,
                      fields=[
                          {"name": "🌿 Branch", "value": f"`{branch_name}`", "inline": True},
                          {"name": "⚡ Status", "value": "`ACTIVE`", "inline": True}
                      ]
                  )
              elif ev_type == 'DeleteEvent':
                  ref_type = payload.get('ref_type', 'ref').upper()
                  ref_name = payload.get('ref')
                  send_discord(
                      w_activity,
                      "Code Pulse",
                      f"🗑️ {ref_type} TERMINATED",
                      f"A {ref_type.lower()} was removed from `{repo}`.",
                      0xff0055, # Laser Crimson Red
                      repo, actor, avatar,
                      fields=[
                          {"name": "🎯 Target", "value": f"`{ref_name}`", "inline": True},
                          {"name": "⚠️ Action", "value": "`DELETED`", "inline": True}
                      ]
                  )

              # 3. STAR TRACKER (#stars-and-forks)
              elif ev_type == 'WatchEvent':
                  send_discord(
                      w_stars,
                      "Star Tracker",
                      "⭐ NEW STAR RECEIVED",
                      f"**{actor}** starred your repository `{repo}`!",
                      0xffd700, # Cyber Gold
                      repo, actor, avatar,
                      fields=[
                          {"name": "📦 Repository", "value": f"`{repo}`", "inline": True},
                          {"name": "👤 Stargazer", "value": f"`{actor}`", "inline": True}
                      ]
                  )
              elif ev_type == 'ForkEvent':
                  send_discord(
                      w_stars,
                      "Star Tracker",
                      "🍴 REPOSITORY FORKED",
                      f"**{actor}** created a fork of `{repo}`!",
                      0xff9900, # Neon Amber
                      repo, actor, avatar,
                      fields=[
                          {"name": "📦 Repository", "value": f"`{repo}`", "inline": True},
                          {"name": "👤 Forked By", "value": f"`{actor}`", "inline": True}
                      ]
                  )

          if new_events:
              with open(state_file, 'w') as f:
                  f.write(str(new_events[0]['id']))
          EOF

      - name: Save Monitor State
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/state/discord_last_event.txt
          git commit -m "Update discord monitor state" || exit 0
          git push
