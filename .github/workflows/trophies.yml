name: Update GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Generate Trophies SVG locally
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/ryo-ma/github-profile-trophy.git /tmp/trophy
          cd /tmp/trophy
          mkdir -p "${{ github.workspace }}/profile-3d-contrib"
          deno run --allow-net --allow-env --allow-read scripts/generate-svg.ts "${{ github.repository_owner }}" tokyonight 6 15 true true > "${{ github.workspace }}/profile-3d-contrib/trophies.svg" || true

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "Update GitHub trophies" || exit 0
          git push
