name: Generate Cyberpunk Contribution Snake

on:
  schedule:
    # Hama dawasama re 12.00 ta (UTC) ibema update wenawa
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Cyberpunk Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-cyberpunk.svg?palette=github-dark&color_snake=#a371f7&color_dots=#161b22,#1f3a60,#2b5b9e,#58a6ff,#a371f7

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
